name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & production build
        run: npm run build

  backend:
    name: Backend — compile, model load & prediction smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # xgboost 3.4.1 (pinned in requirements.txt, matching the training env)
      # requires Python >= 3.12 — same major as the Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all backend packages
        run: python -m compileall -q app

      # Real smoke test: load every M1-M4 artifact exactly like app startup does
      # (no DB involved — ModelRegistry is pure filesystem + joblib), then run
      # full predictions through the risk engine for sample zones & horizons.
      - name: Load all model artifacts & run predictions
        env:
          MODELS_DIR: ./model_artifacts
        run: python smoke_test.py

      - name: Run tests (if present)
        run: |
          if [ -d tests ]; then
            pip install pytest httpx
            pytest -q
          else
            echo "No tests directory yet — skipping pytest"
          fi
