name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & production build
        run: npm run build

  backend:
    name: Backend — compile & import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all backend packages
        run: python -m compileall -q app

      - name: Import smoke test (loads models + risk engine)
        env:
          DATABASE_URL: sqlite:///./ci_smoke.db
          MODELS_DIR: ./model_artifacts
        run: python -c "from app import main; print('backend imports OK')"

      - name: Run tests (if present)
        run: |
          if [ -d tests ]; then
            pip install pytest httpx
            pytest -q
          else
            echo "No tests directory yet — skipping pytest"
          fi
